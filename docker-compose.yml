# Optional containerised Metro bundler. On Windows the recommended daily workflow is
# `npm start` natively (see README): file watching through a bind mount is unreliable.
name: brainy-clan-frontend

services:
  expo:
    build: .
    command: npx expo start --lan
    ports:
      - '8081:8081'
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      # Host advertised in the QR code: your PC's LAN IP (set PC_LAN_IP in .env).
      REACT_NATIVE_PACKAGER_HOSTNAME: ${PC_LAN_IP:?Set PC_LAN_IP in .env}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      # Keep the Linux node_modules inside the container, never on the Windows drive.
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
